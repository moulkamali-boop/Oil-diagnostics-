<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>🛢️ Physics Lab Oil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0f1a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%9B%A2%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;padding:.8rem;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.container{max-width:680px;width:100%;background:#111827;border-radius:2rem;padding:1.2rem;border:2px solid #f5b81b;box-shadow:0 20px 40px -10px #00000080}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f5b81b;padding-bottom:8px;margin-bottom:10px;flex-wrap:wrap}
.title-box{text-align:center;flex:1;min-width:60%}
.title-fixed{font-size:1.1rem;font-weight:800;color:#f5b81b;text-align:center;letter-spacing:.5px;line-height:1.3}
.title-dynamic{font-size:.85rem;font-weight:500;color:#fff;text-align:center;margin-top:3px}
.logo-btn{width:44px;height:44px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;border:1px solid #334155;cursor:pointer;color:#f5b81b;transition:.2s;user-select:none}
.logo-btn:hover{background:#2d3a4e;transform:scale(1.05)}
.icon-btn{width:40px;height:40px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1px solid #334155;cursor:pointer;color:#f5b81b;transition:.2s}
.icon-btn:hover{background:#2d3a4e;transform:scale(1.05)}
.meta-row{display:flex;justify-content:space-between;background:#1e293b;padding:6px 14px;border-radius:30px;font-size:.75rem;margin:4px 0;color:#fff;flex-wrap:wrap;gap:4px}
.meta-row .meta-item{display:flex;align-items:center;gap:4px;color:#cbd5e1;font-size:.75rem}
.meta-row .meta-item span{color:#fff}
.lang-id-row{display:flex;gap:6px;margin:6px 0}
.lang-id-row select,.lang-id-row .id-box{flex:1;padding:4px 8px;background:#1e293b;border:1px solid #334155;border-radius:30px;font-size:.7rem;color:#fff}
.lang-id-row select{appearance:auto;cursor:pointer}
.id-box{text-align:center;font-family:monospace}
.oil-selector-area{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
.oil-selector-area label{font-size:.75rem;color:#b9c7d9;display:flex;align-items:center;gap:6px;white-space:nowrap}
.oil-selector-area select{flex:1;padding:8px 12px;background:#1e293b;border:1px solid #f5b81b;border-radius:30px;color:#fff;font-size:.8rem;cursor:pointer;min-width:120px}
.oil-selector-area select:focus{outline:2px solid #f5b81b}
.credit-section{background:#0f172a;border:2px solid #1e293b;border-radius:16px;padding:10px;margin:6px 0}
.free-badge{font-weight:600;color:#f5b81b;font-size:.8rem;text-align:center}
.pack-row{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.pack-btn{background:#1e293b;border:1px solid #f5b81b;border-radius:30px;padding:6px 10px;font-size:.75rem;cursor:pointer;color:#fff;text-align:center;font-weight:500;width:100%;transition:.2s;font-family:inherit}
.pack-btn:hover{background:#f5b81b;color:#0a0f1a}
.code-row{display:flex;gap:6px;margin-top:4px}
.code-row input{flex:1;padding:4px 10px;background:#1e293b;border:1px solid #334155;border-radius:30px;color:#fff;font-size:.7rem}
.code-row button{background:#3b82f6;border:none;border-radius:30px;padding:4px 14px;color:#fff;font-weight:600;cursor:pointer;font-size:.7rem;transition:.2s;font-family:inherit}
.code-row button:hover{background:#2563eb}
.code-row button:disabled{opacity:.5;cursor:not-allowed}
.divider{height:2px;background:linear-gradient(90deg,transparent,#f5b81b,transparent);margin:8px 0;opacity:.6}
.start-btn{width:100%;padding:14px;background:linear-gradient(135deg,#f5b81b,#e67e22);border:none;border-radius:40px;font-weight:700;color:#0a0f1a;font-size:1rem;cursor:pointer;margin:8px 0;transition:.2s;letter-spacing:.5px;font-family:inherit}
.start-btn:hover{transform:scale(1.02);box-shadow:0 0 30px #f5b81b44}
.start-btn:disabled{opacity:.5;cursor:not-allowed}
.final-btn{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:40px;font-weight:700;color:#fff;font-size:1rem;cursor:pointer;margin:8px 0;transition:.2s;font-family:inherit}
.final-btn:hover:not(:disabled){transform:scale(1.02);box-shadow:0 0 30px #10b98144}
.final-btn:disabled{opacity:.4;cursor:not-allowed}
#labArea{display:none;margin-top:10px}
.sensor-card{background:#0f172a;border:3px solid #334155;border-radius:16px;padding:12px;margin-bottom:10px;transition:.3s}
.sensor-card.measuring{border-color:#3b82f6;background:#1e3a8a22}
.sensor-card.done{border-color:#2ecc71;background:#064e3b44}
.sensor-card.failed{border-color:#ef4444;background:#7f1d1d44}
.sensor-card.skipped{border-color:#f59e0b;background:#78350f44}
.sensor-card.confirmed{border-color:#10b981;background:#065f4644;box-shadow:0 0 16px #10b98144}
.sensor-header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.9rem;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.sensor-header .tool{font-size:.6rem;color:#94a3b8;font-weight:400}
.sensor-icon{font-size:1.6rem;margin-left:4px;display:inline-block;vertical-align:middle}
.sensor-instruction{font-size:.7rem;color:#cbd5e1;margin:4px 0 6px 0;padding:4px 12px;background:#1e293b;border-radius:30px;border:1px solid #334155;display:inline-block}
.sensor-preview{background:#000;border-radius:12px;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#94a3b8;border:1px solid #334155;margin:6px 0;padding:6px;flex-direction:column;text-align:center}
.sensor-result{font-size:.85rem;font-weight:700;color:#fff;margin:4px 0;min-height:20px}
.sensor-result.sub{font-size:.7rem;color:#cbd5e1;font-weight:400;min-height:14px}
.sensor-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.sensor-actions button{padding:8px 4px;border:none;border-radius:30px;font-weight:700;cursor:pointer;font-size:.7rem;transition:.2s;font-family:inherit}
.sensor-actions button:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}
.sensor-actions button:hover:not(:disabled){transform:scale(1.03)}
.btn-measure{background:#3b82f6;color:#fff}
.btn-retry{background:#f59e0b;color:#0a0f1a}
.btn-done{background:#10b981;color:#fff}
.btn-skip{background:#6c7a92;color:#fff}
.note-section{background:#0f172a;border:2px solid #334155;border-radius:16px;padding:12px;margin:10px 0}
.note-title{font-size:.85rem;font-weight:700;color:#f5b81b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.note-buttons{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.note-buttons button{flex:1;padding:8px 10px;border:none;border-radius:30px;font-weight:600;cursor:pointer;font-size:.75rem;transition:.2s;min-width:80px;font-family:inherit}
.btn-speak{background:#8b5cf6;color:#fff}
.btn-speak:hover:not(:disabled){background:#7c3aed}
.btn-write{background:#06b6d4;color:#fff}
.btn-write:hover:not(:disabled){background:#0891b2}
#noteTextArea{width:100%;min-height:60px;padding:8px 10px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;font-size:.8rem;font-family:inherit;resize:vertical;display:none}
#noteTextArea:focus{border-color:#f5b81b;outline:none}
#recordingIndicator{display:none;align-items:center;justify-content:center;gap:8px;font-size:.75rem;color:#f5b81b;padding:6px;margin-top:4px}
#recordingIndicator.active{display:flex}
#recordingIndicator .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
.final-verdict{background:#0f172a;border-radius:20px;padding:16px;margin-top:10px;text-align:center;border:3px solid #334155;display:none;transition:.3s}
.final-verdict.show{display:block}
.final-verdict.green{background:#064e3b;border-color:#2ecc71}
.final-verdict.yellow{background:#78350f;border-color:#f59e0b}
.final-verdict.orange{background:#7f1d1d;border-color:#ef4444}
.final-verdict.gray{background:#1e293b;border-color:#6c7a92}
.final-icon{font-size:2.4rem;margin-bottom:6px}
.verdict-sentence{font-size:.95rem;font-weight:700;color:#fff;background:#0f172a;border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.6;text-align:right}
.verdict-solution{font-size:.9rem;font-weight:600;color:#4ade80;background:#0f172a;border-radius:14px;padding:10px 12px;margin:6px 0;line-height:1.5;text-align:right}
.verdict-note{font-size:.85rem;color:#f5b81b;background:#0f172a;border-radius:14px;padding:10px 12px;margin:6px 0;line-height:1.5;font-style:italic;text-align:right}
.sensor-count-notice{font-size:.8rem;font-weight:600;padding:8px 12px;border-radius:30px;margin:8px 0;display:inline-block}
.sensor-count-notice.good{background:#2ecc7133;color:#2ecc71;border:1px solid #2ecc71}
.sensor-count-notice.partial{background:#f59e0b33;color:#f59e0b;border:1px solid #f59e0b}
.sensor-count-notice.limited{background:#ef444433;color:#ef4444;border:1px solid #ef4444}
.sensor-count-notice.none{background:#6c7a9233;color:#94a3b8;border:1px solid #6c7a92}
.verdict-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.verdict-actions button{flex:1;padding:12px 14px;border:none;border-radius:40px;font-weight:700;cursor:pointer;font-size:.85rem;transition:.2s;min-width:130px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.btn-return{background:#334155;color:#fff;border:2px solid #64748b}
.btn-return:hover{background:#475569;transform:scale(1.02)}
.toolbar{display:flex;gap:6px;justify-content:center;margin:12px 0 6px;flex-wrap:wrap}
.tool-btn{background:#1e293b;border:1px solid #334155;border-radius:30px;padding:8px 14px;font-size:.75rem;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s;flex:1;justify-content:center;min-width:70px;font-family:inherit}
.tool-btn:hover:not(:disabled){background:#2d3a4e;border-color:#f5b81b}
.tool-btn:disabled{opacity:.5;cursor:not-allowed}
.tool-btn i{font-size:.9rem;color:#f5b81b}
.tool-btn:disabled i{color:#64748b}
.rating{text-align:center;font-size:.75rem;color:#94a3b8;margin:8px 0}
.stars{color:#f5b81b;font-size:1.1rem}
.stars span{cursor:pointer;transition:.2s;display:inline-block}
.stars span:hover{transform:scale(1.2)}
.consent-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}
.consent-overlay.show{display:flex}
.consent-box{background:#1e293b;border:2px solid #f5b81b;border-radius:24px;padding:20px;max-width:400px;width:100%;text-align:center}
.consent-box .legal-icon{font-size:2.4rem;margin-bottom:8px}
.consent-box h2{color:#f5b81b;font-size:1.1rem;margin-bottom:8px}
.consent-box .legal-text{color:#cbd5e1;font-size:.85rem;line-height:1.6;padding:8px 0}
.consent-box .btn-consent{background:#f5b81b;border:none;padding:10px 24px;border-radius:40px;font-weight:700;color:#0a0f1a;cursor:pointer;font-size:.9rem;margin-top:8px;transition:.2s;width:100%;font-family:inherit}
.consent-box .btn-refuse{background:#334155;border:none;padding:8px 20px;border-radius:40px;font-weight:600;color:#94a3b8;cursor:pointer;font-size:.85rem;margin-top:6px;transition:.2s;width:100%;font-family:inherit}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:1500;padding:16px}
.confirm-overlay.show{display:flex}
.confirm-box{background:#1e293b;border:2px solid #f5b81b;border-radius:24px;padding:22px;max-width:420px;width:100%;text-align:center}
.confirm-box .icon{font-size:2.5rem;margin-bottom:8px}
.confirm-box h3{color:#f5b81b;font-size:1.05rem;margin-bottom:10px}
.confirm-box .msg{color:#cbd5e1;font-size:.85rem;line-height:1.6;padding:6px 0;text-align:center}
.confirm-box .btn-confirm{background:linear-gradient(135deg,#10b981,#059669);border:none;padding:12px 24px;border-radius:40px;font-weight:700;color:#fff;cursor:pointer;font-size:.9rem;margin-top:8px;width:100%;font-family:inherit}
.confirm-box .btn-cancel{background:#334155;border:none;padding:10px 24px;border-radius:40px;font-weight:600;color:#cbd5e1;cursor:pointer;font-size:.85rem;margin-top:6px;width:100%;font-family:inherit}
.secret-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(4px)}
.secret-modal.show{display:flex}
.secret-box{background:#1e293b;padding:20px;border-radius:24px;text-align:center;border:2px solid #f5b81b;max-width:340px;width:90%}
.secret-box .lock-icon{font-size:2.6rem;color:#f5b81b}
.secret-box h3{color:#f5b81b;margin:6px 0;font-size:1rem}
.secret-box p{color:#cbd5e1;font-size:.75rem;margin-bottom:10px}
.secret-box input{background:#0f172a;border:2px solid #f5b81b;border-radius:40px;padding:10px 14px;color:#fff;width:100%;margin:10px 0;font-size:.9rem;text-align:center;letter-spacing:4px;font-family:inherit}
.secret-box .btn-confirm{background:linear-gradient(135deg,#f5b81b,#e67e22);border:none;border-radius:40px;padding:10px 16px;font-weight:700;color:#0a0f1a;cursor:pointer;width:100%;font-size:.85rem;transition:.2s;font-family:inherit}
.secret-box .btn-close{background:#555;border:none;border-radius:40px;padding:8px 14px;font-weight:700;color:#fff;cursor:pointer;width:100%;margin-top:6px;font-size:.8rem;transition:.2s;font-family:inherit}
.secret-box .btn-reset{background:transparent;border:none;color:#94a3b8;font-size:.7rem;cursor:pointer;margin-top:8px;text-decoration:underline;font-family:inherit}
.toast-custom{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1e293b;border:2px solid #f5b81b;color:#fff;padding:8px 18px;border-radius:40px;font-size:.75rem;z-index:1000;box-shadow:0 8px 30px rgba(0,0,0,.6);text-align:center;max-width:90%;font-weight:500;display:none}
.purchase-prompt{display:none;background:#0f172a;border:2px solid #f59e0b;border-radius:16px;padding:14px;margin:10px 0;text-align:center}
.purchase-prompt.show{display:block}
.purchase-prompt .pp-icon{font-size:2rem;margin-bottom:6px}
.purchase-prompt .pp-title{color:#f59e0b;font-weight:700;font-size:.95rem;margin-bottom:6px}
.purchase-prompt .pp-msg{color:#cbd5e1;font-size:.8rem;margin-bottom:10px;line-height:1.5}
.legal-line{font-size:.55rem;color:#94a3b8;margin-top:8px;border-top:1px solid #334155;padding-top:8px;font-weight:300;text-align:center}
.legal-line strong{color:#f5b81b}
.legal-links-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 8px;padding-top:12px;border-top:1px solid #334155}
.legal-link-btn{background:#1e293b;border:1px solid #334155;border-radius:30px;padding:6px 12px;font-size:.7rem;color:#cbd5e1;cursor:pointer;font-family:inherit;transition:.2s;display:flex;align-items:center;gap:4px}
.legal-link-btn:hover{background:#2d3a4e;border-color:#f5b81b;color:#f5b81b}
.legal-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:4000;padding:16px;backdrop-filter:blur(4px)}
.legal-modal-overlay.show{display:flex}
.legal-modal-box{background:#1e293b;border:2px solid #f5b81b;border-radius:20px;max-width:520px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.legal-modal-header{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0 8px;border-bottom:2px solid #334155}
.legal-modal-tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.legal-modal-tabs button{background:#0f172a;border:none;color:#94a3b8;padding:8px 10px;font-size:.65rem;font-weight:600;cursor:pointer;font-family:inherit;border-radius:10px 10px 0 0;white-space:nowrap;transition:.2s}
.legal-modal-tabs button.active{background:#1e293b;color:#f5b81b;box-shadow:inset 0 -2px 0 #f5b81b}
.legal-modal-close-x{background:transparent;border:none;color:#94a3b8;font-size:1.2rem;cursor:pointer;padding:4px 8px;font-family:inherit}
.legal-modal-body{flex:1;overflow-y:auto;padding:16px 20px;color:#cbd5e1;font-size:.78rem;line-height:1.85;text-align:right;direction:rtl}
.legal-modal-body h4{color:#f5b81b;font-size:.85rem;margin:12px 0 6px;border-right:3px solid #f5b81b;padding-right:8px}
.legal-modal-body p{margin-bottom:8px}
.legal-modal-body ul{padding-right:20px;margin-bottom:8px}
.legal-modal-body a{color:#f5b81b;text-decoration:none;word-break:break-all}
.legal-modal-footer{padding:8px 12px;border-top:1px solid #334155;display:flex;justify-content:center}
.legal-modal-close-btn{background:#334155;border:none;border-radius:40px;padding:8px 24px;color:#fff;font-weight:600;cursor:pointer;font-size:.8rem;font-family:inherit;transition:.2s}
.report-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px;overflow-y:auto}
.report-overlay.show{display:flex}
.report-container{background:#fff;color:#1a1a1a;border-radius:16px;max-width:720px;width:100%;padding:30px;direction:ltr;font-family:'Segoe UI',system-ui,sans-serif}
.report-header{text-align:center;border-bottom:3px solid #f5b81b;padding-bottom:15px;margin-bottom:20px}
.report-header h1{font-size:1.6rem;color:#0a0f1a;margin-bottom:6px}
.report-header .subtitle{color:#666;font-size:.85rem}
.report-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;font-size:.85rem}
.report-info div{padding:8px 12px;background:#f5f5f5;border-radius:8px;border-left:3px solid #f5b81b}
.report-info strong{color:#0a0f1a;display:block;font-size:.7rem;margin-bottom:2px;text-transform:uppercase}
.report-section{margin-bottom:18px}
.report-section h2{font-size:1rem;color:#0a0f1a;border-left:4px solid #f5b81b;padding-left:10px;margin-bottom:12px;font-weight:700}
.report-section .sensor-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f9f9f9;border-radius:8px;margin-bottom:6px;font-size:.85rem;border-left:3px solid #ccc}
.report-section .sensor-row.ok{border-left-color:#10b981;background:#f0fdf4}
.report-section .sensor-row.skip{border-left-color:#f59e0b;background:#fffbeb}
.report-section .sensor-row.none{border-left-color:#94a3b8;background:#f8fafc}
.report-verdict{background:#f0f9f0;border-left:4px solid #10b981;padding:16px;border-radius:8px;margin-bottom:10px}
.report-verdict p{color:#0a0f1a;font-size:.9rem;line-height:1.6;margin-bottom:6px}
.report-verdict .solution{color:#166534;font-size:.85rem;padding:8px 12px;background:#dcfce7;border-radius:6px;margin-top:8px}
.report-note{background:#fef3c7;border-left:4px solid #f59e0b;padding:12px;border-radius:8px;font-size:.85rem;color:#78350f;margin-top:10px;font-style:italic}
.report-disclaimer{background:#fff7ed;border-left:4px solid #f59e0b;padding:12px;border-radius:8px;font-size:.75rem;color:#7c2d12;margin-top:20px;line-height:1.5}
.report-watermark{text-align:center;font-size:.7rem;color:#94a3b8;margin-top:24px;padding-top:12px;border-top:1px dashed #cbd5e1;font-style:italic}
.report-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.report-actions button{flex:1;padding:12px;border:none;border-radius:30px;font-weight:700;cursor:pointer;font-size:.9rem;transition:.2s;min-width:130px;font-family:inherit}
.btn-print-pdf{background:#dc2626;color:#fff}
.btn-close-report{background:#6b7280;color:#fff}
@media print{body>*:not(.report-overlay){display:none!important}.report-overlay{position:static;background:#fff;padding:0;display:block!important}.report-container{box-shadow:none;border-radius:0;max-width:100%}.report-actions{display:none!important}}
@media(max-width:480px){
    .meta-row{font-size:.65rem;padding:4px 10px}
    .container{padding:.8rem}

const ADMIN_HASH_KEY = 'oilAdminHash';
const CREDITS_KEY = 'oilCredits';
const DEVICE_KEY = 'oilDeviceId';
const BASELINE_KEY = 'oilBaseline';

function sha256Hex(str) {
    if (window.crypto && crypto.subtle) {
        try {
            const enc = new TextEncoder().encode(str);
            return crypto.subtle.digest('SHA-256', enc).then(buf =>
                Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('')
            );
        } catch (e) {}
    }
    let h1 = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) h1 = Math.imul(h1 ^ str.charCodeAt(i), 16777619) >>> 0;
    return Promise.resolve('fb_' + h1.toString(16).padStart(8, '0'));
}
function getAdminHash() { return localStorage.getItem(ADMIN_HASH_KEY); }
function setAdminPassword(p) { return sha256Hex(p).then(h => localStorage.setItem(ADMIN_HASH_KEY, h)); }
function verifyAdminPassword(p) {
    const h = getAdminHash(); if (!h) return Promise.resolve(false);
    return sha256Hex(p).then(ph => ph === h);
}
function sanitizeLegacyHash() {
    const stored = getAdminHash();
    if (stored && !/^[a-f0-9]{64}$/i.test(stored) && !/^fb_/.test(stored)) localStorage.removeItem(ADMIN_HASH_KEY);
}
function resetAdminPassword() {
    if (confirm('Reset developer password?')) {
        localStorage.removeItem(ADMIN_HASH_KEY);
        isAdmin = false;
        document.getElementById('secretPassword').value = '';
        showToast(t('password_reset'));
        closeAdminModal();
    }
}
function openAdminModal() {
    sanitizeLegacyHash();
    const title = document.getElementById('secretTitle');
    const sub = document.getElementById('secretSub');
    const resetBtn = document.getElementById('resetPwdBtn');
    if (!getAdminHash()) {
        title.textContent = '👑 ' + t('new_password');
        sub.textContent = t('new_password');
        resetBtn.style.display = 'none';
    } else {
        title.textContent = '🔐 ' + t('developer');
        sub.textContent = t('password');
        resetBtn.style.display = 'inline-block';
        resetBtn.textContent = '🔄 ' + t('password_reset');
    }
    document.getElementById('secretPassword').value = '';
    document.getElementById('secretModal').classList.add('show');
    setTimeout(() => document.getElementById('secretPassword').focus(), 100);
}
function closeAdminModal() { document.getElementById('secretModal').classList.remove('show'); }
function checkAdminPasswordSubmit() {
    const pwd = document.getElementById('secretPassword').value;
    if (!pwd) { showToast('⚠️ ' + t('password')); return; }
    if (!getAdminHash()) {
        if (pwd.length < 4) { showToast('⚠️ 4+ chars'); return; }
        setAdminPassword(pwd).then(() => {
            isAdmin = true;
            updateCreditsDisplay();
            showToast('✅ ' + t('password_set'));
            document.getElementById('secretPassword').value = '';
            closeAdminModal();
        });
        return;
    }
    verifyAdminPassword(pwd).then(ok => {
        if (ok) {
            isAdmin = true;
            updateCreditsDisplay();
            showToast('👑 ' + t('developer_active'));
            document.getElementById('secretPassword').value = '';
            closeAdminModal();
        } else {
            showToast('❌ ' + t('wrong_password'));
            document.getElementById('secretPassword').value = '';
        }
    });
}

function saveBaselineIfQualityGood(sensorId, rawData, qualityScore) {
    if (!qualityScore || qualityScore < 0.7) return;
    if (!rawData) return;
    let b = {};
    try { b = JSON.parse(localStorage.getItem(BASELINE_KEY) || '{}'); } catch (e) {}
    const key = sensorId === 1 ? 'damping' : sensorId === 2 ? 'magnetic' : 'color';
    if (!b[key]) {
        b[key] = rawData;
        b.savedAt = Date.now();
        try { localStorage.setItem(BASELINE_KEY, JSON.stringify(b)); } catch (e) {}
    }
}

function verifyGumroadLicense(key) {
    const permalinks = Object.keys(GUMROAD_PRODUCTS);
    const tryNext = (idx) => {
        if (idx >= permalinks.length) return Promise.resolve({ valid: false });
        const permalink = permalinks[idx];
        return fetch('https://api.gumroad.com/v2/licenses/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ product_permalink: permalink, license_key: key, increment_uses_count: 'false' }).toString()
        })
        .then(res => res.json())
        .then(data => {
            if (data && data.success && data.purchase && !data.purchase.refunded && !data.purchase.chargebacked) {
                try {
                    fetch('https://api.gumroad.com/v2/licenses/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ product_permalink: permalink, license_key: key, increment_uses_count: 'true' }).toString()
                    });
                } catch (e) {}
                return { valid: true, credits: GUMROAD_PRODUCTS[permalink], uses: data.uses || 0 };
            }
            return tryNext(idx + 1);
        })
        .catch(() => tryNext(idx + 1));
    };
    return tryNext(0);
}

    if (sensorState[id].status === 'measuring') return;

    if (sensorState[id].status === 'skipped') sensorState[id].status = 'idle';

    updateSensorUI(id);

// ═══ 16. القياسات ═══
function measureVibration() {
    return new Promise(resolve => {
        if (typeof DeviceMotionEvent === 'undefined') { resolve(null); return; }
        const samples = [];
        const startTime = Date.now();
        const duration = 2500;
        const handler = e => {
            const acc = e.accelerationIncludingGravity || e.acceleration;
            if (!acc) return;
            const mag = Math.sqrt((acc.x||0)**2 + (acc.y||0)**2 + (acc.z||0)**2);
            samples.push(mag);
        };
        motionHandler = handler;
        window.addEventListener('devicemotion', handler);
        setTimeout(() => {
            window.removeEventListener('devicemotion', handler);
            motionHandler = null;
            if (samples.length < 10) { resolve(null); return; }
            const mean = samples.reduce((a,b) => a+b, 0) / samples.length;
            const variance = samples.reduce((a,b) => a + Math.pow(b-mean, 2), 0) / samples.length;
            const std = Math.sqrt(variance);
            if (std < 0.05) { resolve(null); return; }
            const damping = Math.min(0.35, Math.max(0.05, 0.2 / (std + 0.5)));
            const rounded = Math.round(damping * 1000) / 1000;
            const quality = Math.min(1, std / 0.3);
            resolve({
                value: rounded + ' ' + t('unit_damping'),
                sub: 'σ = ' + std.toFixed(3),
                raw: rounded,
                quality: quality
            });
        }, duration);
    });
}
function measureMagnetic() {
    return new Promise(resolve => {
        if (typeof DeviceOrientationEvent === 'undefined') { resolve(null); return; }
        const samples = [];
        const startTime = Date.now();
        const duration = 2500;
        const handler = e => {
            const heading = (e.webkitCompassHeading !== undefined) ? e.webkitCompassHeading : e.alpha;
            if (heading !== undefined && heading !== null) samples.push(heading);
        };
        window.addEventListener('deviceorientation', handler);
        setTimeout(() => {
            window.removeEventListener('deviceorientation', handler);
            if (samples.length < 3) { resolve(null); return; }
            const mean = samples.reduce((a,b) => a+b, 0) / samples.length;
            const magnetic = 30 + (mean % 360) / 360 * 40;
            const rounded = Math.round(magnetic * 10) / 10;
            const quality = Math.min(1, samples.length / 20);
            resolve({
                value: rounded + ' ' + t('unit_magnetic'),
                sub: 'n = ' + samples.length,
                raw: rounded,
                quality: quality
            });
        }, duration);
    });
}
function measureColor() {
    return new Promise(resolve => {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { resolve(null); return; }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                streams.video = stream;
                const video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');
                video.muted = true;
                video.play().then(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 160; canvas.height = 120;
                    const ctx = canvas.getContext('2d');
                    let sumR = 0, sumG = 0, sumB = 0, frames = 0;
                    const startTime = Date.now();
                    const interval = setInterval(() => {
                        ctx.drawImage(video, 0, 0, 160, 120);
                        const img = ctx.getImageData(0, 0, 160, 120).data;
                        let r = 0, g = 0, b = 0;
                        for (let i = 0; i < img.length; i += 4) { r += img[i]; g += img[i+1]; b += img[i+2]; }
                        const px = img.length / 4;
                        sumR += r/px; sumG += g/px; sumB += b/px;
                        frames++;
                        if (Date.now() - startTime > 2500) {
                            clearInterval(interval);
                            cleanupStreams(3);
                            if (frames < 5) { resolve(null); return; }
                            const avgR = Math.round(sumR/frames);
                            const avgG = Math.round(sumG/frames);
                            const avgB = Math.round(sumB/frames);
                            const brightness = (avgR + avgG + avgB) / 3;
                            if (brightness < 30 || brightness > 245) { resolve(null); return; }
                            const quality = 1 - Math.abs(brightness - 128) / 128;
                            resolve({
                                value: 'RGB(' + avgR + ', ' + avgG + ', ' + avgB + ')',
                                sub: t('unit_color'),
                                raw: { r: avgR, g: avgG, b: avgB },
                                quality: Math.max(0, quality)
                            });
                        }
                    }, 100);
                }).catch(() => { cleanupStreams(3); resolve(null); });
            })
            .catch(() => resolve(null));
    });
}

function renderFinalVerdict() {
    const confirmed = getConfirmedCount();
    const measured = getMeasuredCount();
    const fv = document.getElementById('finalVerdict');
    const icon = document.getElementById('finalIcon');
    const sentence = document.getElementById('verdictSentence');
    const solDiv = document.getElementById('verdictSolution');
    const noteDiv = document.getElementById('verdictNote');
    const countNotice = document.getElementById('sensorCountNotice');
    fv.className = 'final-verdict show';
    if (measured === 0) {
        fv.classList.add('gray');
        icon.textContent = '⚠️';
        sentence.textContent = t('no_data');
        sentence.style.color = '#f59e0b';
        solDiv.textContent = t('solution_weak');
        solDiv.style.display = 'block';
        solDiv.style.color = '#94a3b8';
        countNotice.className = 'sensor-count-notice none';
        countNotice.textContent = t('sensor_count_0');
        noteDiv.style.display = 'none';
        fv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }
    if (confirmed === 3) { countNotice.className = 'sensor-count-notice good'; countNotice.textContent = t('sensor_count_3'); }
    else if (confirmed === 2) { countNotice.className = 'sensor-count-notice partial'; countNotice.textContent = t('sensor_count_2'); }
    else if (confirmed === 1) { countNotice.className = 'sensor-count-notice limited'; countNotice.textContent = t('sensor_count_1'); }
    else { countNotice.className = 'sensor-count-notice none'; countNotice.textContent = t('sensor_count_0'); }

    // ═══ المقارنة ═══
    const oil = getCurrentOilData();
    const vib = sensorState[1].raw;
    const mag = sensorState[2].raw;
    const col = sensorState[3].raw;

    let matchCount = 0, totalChecks = 0;
    if (vib !== undefined && vib !== null) {
        totalChecks++;
        if (Math.abs(vib - oil.damping) / oil.damping < 0.15) matchCount++;
    }
    if (mag !== undefined && mag !== null) {
        totalChecks++;
        if (Math.abs(mag - oil.magnetic) / oil.magnetic < 0.15) matchCount++;
    }
    if (col !== undefined && col !== null) {
        totalChecks++;
        if (Math.abs(col.r - oil.color.r) < 40 && Math.abs(col.g - oil.color.g) < 40 && Math.abs(col.b - oil.color.b) < 40) matchCount++;
    }

    // ⚡ الملاحظة تُدمج بصمت بنسبة 5% كحد أقصى — دون إعلان
    const noteText = (document.getElementById('noteTextArea').value || '').trim();
    const noteBonus = noteText.length >= 4 ? 0.05 : 0;
    const matchRatio = totalChecks > 0 ? Math.min(1, matchCount / totalChecks + noteBonus) : 0;

    let level, msg, sol;
    if (totalChecks === 0) {
        level = 'gray'; msg = t('verdict_no_data'); sol = t('solution_weak');
    } else if (matchRatio >= 0.95) {
        level = 'green'; msg = t('verdict_match');
        sol = t('solution_match', oil.label);
    } else if (matchRatio >= 0.5) {
        level = 'yellow'; msg = t('verdict_partial');
        sol = t('solution_partial', oil.label);
    } else {
        level = 'orange'; msg = t('verdict_no_match');
        sol = t('solution_no_match', oil.label);
    }

    fv.classList.add(level === 'green' ? 'green' : level === 'yellow' ? 'yellow' : level === 'orange' ? 'orange' : 'gray');
    icon.textContent = level === 'green' ? '🟢' : level === 'yellow' ? '🟡' : level === 'orange' ? '🟠' : '⚪';
    sentence.textContent = msg;
    sentence.style.color = '#fff';
    solDiv.textContent = '🔧 ' + sol;
    solDiv.style.display = 'block';
    solDiv.style.color = level === 'green' ? '#4ade80' : level === 'yellow' ? '#f5b81b' : '#fb923c';

    // عرض الملاحظة بدون أي تحذير
    if (noteText.length >= 4) {
        noteDiv.textContent = '💭 ' + noteText;
        noteDiv.style.display = 'block';
    } else {
        noteDiv.style.display = 'none';
    }
    fv.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function returnFromVerdict() {
    document.getElementById('finalVerdict').classList.remove('show');
    document.getElementById('labArea').style.display = 'none';
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').style.opacity = '1';
    for (let i = 1; i <= 3; i++) {
        cleanupStreams(i);
        sensorState[i] = { status: 'idle', value: null, sub: null, raw: null, confirmed: false };
        updateSensorUI(i);
    }
    finalShown = false;
    userNote = '';
    document.getElementById('noteTextArea').value = '';
    document.getElementById('noteTextArea').style.display = 'none';
    document.getElementById('printBtn').disabled = true;
    document.getElementById('finalBtn').disabled = true;
    if (getTotalCredits() <= 0) document.getElementById('purchasePrompt').classList.add('show');
    else document.getElementById('purchasePrompt').classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ═══ 18. البدء ═══
function requestStart() {
    if (getTotalCredits() <= 0) {
        document.getElementById('purchasePrompt').classList.add('show');
        showToast('⚠️ ' + t('no_credits'));
        return;
    }
    document.getElementById('purchasePrompt').classList.remove('show');
    document.getElementById('consentOverlay').classList.add('show');
}
function acceptConsent() {
    consentGiven = true;
    document.getElementById('consentOverlay').classList.remove('show');
    startLab();
}
function refuseConsent() {
    document.getElementById('consentOverlay').classList.remove('show');
    window._pendingSensor = null;
}
function startLab() {
    document.getElementById('labArea').style.display = 'block';
    document.getElementById('startBtn').disabled = true;
    document.getElementById('startBtn').style.opacity = '0.5';
    document.getElementById('labArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
    for (let i = 1; i <= 3; i++) {
        cleanupStreams(i);
        sensorState[i] = { status: 'idle', value: null, sub: null, raw: null, confirmed: false };
        updateSensorUI(i);
    }
    finalShown = false;
    userNote = '';
    document.getElementById('noteTextArea').value = '';
    document.getElementById('noteTextArea').style.display = 'none';
    document.getElementById('finalVerdict').classList.remove('show');
    document.getElementById('printBtn').disabled = true;
    updateFinalBtnState();
    if (window._pendingSensor) {
        const id = window._pendingSensor;
        window._pendingSensor = null;
        setTimeout(() => measureSensor(id), 300);
    }
}

// ═══ 19. الملاحظات ═══
function toggleNoteText() {
    const ta = document.getElementById('noteTextArea');
    if (ta.style.display === 'block') { ta.style.display = 'none'; userNote = ta.value; }
    else { ta.style.display = 'block'; ta.focus(); }
}
function startVoiceNote() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('⚠️ ' + t('voice_not_supported')); toggleNoteText(); return; }
    if (isRecording) return;
    isRecording = true;
    document.getElementById('recordingIndicator').classList.add('active');
    document.getElementById('speakBtn').disabled = true;
    recognition = new SR();
    const langMap = { ar:'ar-SA', fr:'fr-FR', es:'es-ES', de:'de-DE', it:'it-IT', pt:'pt-PT', ru:'ru-RU', zh:'zh-CN', ja:'ja-JP', ko:'ko-KR', hi:'hi-IN', tr:'tr-TR', id:'id-ID', ms:'ms-MY', vi:'vi-VN', th:'th-TH', nl:'nl-NL', pl:'pl-PL', sv:'sv-SE', fa:'fa-IR', ur:'ur-PK', sw:'sw-KE' };
    recognition.lang = langMap[currentLang] || 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = e => {
        const text = e.results[0][0].transcript;
        const ta = document.getElementById('noteTextArea');
        ta.style.display = 'block';
        ta.value = (ta.value ? ta.value + ' ' : '') + text;
        userNote = ta.value;
    };
    recognition.onerror = () => {};
    recognition.onend = () => { stopVoiceNote(); };
    try { recognition.start(); } catch (e) { stopVoiceNote(); }
    recordingTimeout = setTimeout(() => stopVoiceNote(), 5000);
}
function stopVoiceNote() {
    if (!isRecording) return;
    isRecording = false;
    clearTimeout(recordingTimeout);
    document.getElementById('recordingIndicator').classList.remove('active');
    document.getElementById('speakBtn').disabled = false;
    try { if (recognition) recognition.stop(); } catch (e) {}
    const ta = document.getElementById('noteTextArea');
    if (ta) userNote = ta.value;
}

// ═══ 20. التقرير النصي ═══
function getReportText() {
    const now = new Date();
    const lines = [];
    lines.push('🛢️ Physics Lab Oil');
    lines.push('━━━━━━━━━━━━━━━━━━━━');
    lines.push('📅 ' + t('report_date') + ': ' + now.toLocaleDateString('en-GB'));
    lines.push('🕐 ' + t('report_time') + ': ' + now.toLocaleTimeString('en-GB'));
    lines.push('🆔 ' + t('report_device') + ': ' + document.getElementById('deviceId').textContent);
    const locEl = document.getElementById('locationDisplay');
    if (locEl && locationStatus && !['denied','unavailable','na'].includes(locationStatus)) {
        lines.push('📍 GPS: ' + locationStatus);
    }
    lines.push('🛢️ ' + t('oil_label') + ' ' + getCurrentOilData().label);
    lines.push('━━━━━━━━━━━━━━━━━━━━');
    lines.push('📊 ' + t('report_sensors_used') + ':');
    for (let i = 1; i <= 3; i++) {
        const st = sensorState[i];
        const icon = i === 1 ? '📳' : i === 2 ? '🧲' : '📸';
        if (st.status === 'done' && st.confirmed) lines.push('  ✅ ' + icon + ' ' + t('sensor' + i) + ' — ' + (st.value || ''));
        else if (st.status === 'done') lines.push('  ⚡ ' + icon + ' ' + t('sensor' + i) + ' — ' + (st.value || ''));
        else if (st.status === 'skipped') lines.push('  ⏭ ' + icon + ' ' + t('sensor' + i) + ' (' + t('skipped_msg') + ')');
        else lines.push('  ⬜ ' + icon + ' ' + t('sensor' + i) + ' (' + t('not_measured') + ')');
    }
    lines.push('━━━━━━━━━━━━━━━━━━━━');
    if (finalShown) {
        lines.push('📋 ' + t('report_verdict') + ':');
        lines.push(document.getElementById('verdictSentence').textContent);
        const sol = document.getElementById('verdictSolution').textContent;
        if (sol && sol.length > 3) { lines.push(''); lines.push('🔧 ' + t('report_solution') + ':'); lines.push(sol); }
        lines.push('');
        lines.push(document.getElementById('sensorCountNotice').textContent);
    } else {
        lines.push('⚠️ ' + t('no_data'));
    }
    lines.push('━━━━━━━━━━━━━━━━━━━━');
    lines.push('⚠️ ' + t('legal'));
    lines.push('');
    lines.push('© 2026 Physics Lab Oil');
    return lines.join('\n');
}

// ═══ 21. الأدوات الذكية ═══
function listenAction() {
    let text = '';
    if (finalShown) {
        text = document.getElementById('verdictSentence').textContent;
        const sol = document.getElementById('verdictSolution');
        if (sol && sol.textContent && sol.style.display !== 'none') text += '. ' + sol.textContent;
    } else {
        text = 'Physics Lab Oil — ' + t('app_title');
    }
    const u = new SpeechSynthesisUtterance(text);
    const langMap = { ar:'ar-SA', fr:'fr-FR', es:'es-ES', de:'de-DE', it:'it-IT', pt:'pt-PT', ru:'ru-RU', zh:'zh-CN', ja:'ja-JP', ko:'ko-KR', hi:'hi-IN', tr:'tr-TR', id:'id-ID', ms:'ms-MY', vi:'vi-VN', th:'th-TH', nl:'nl-NL', pl:'pl-PL', sv:'sv-SE', fa:'fa-IR', ur:'ur-PK', sw:'sw-KE' };
    u.lang = langMap[currentLang] || 'en-US';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
}
function copyAction() {
    const text = finalShown ? getReportText() : window.location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast('📋 ' + t('copied'))).catch(() => showToast('📋 ' + t('copied')));
    else showToast('📋 ' + t('copied'));
}
function shareAction() {
    const text = finalShown ? getReportText() : window.location.href;
    const title = finalShown ? '🛢️ ' + t('report_title') : '🛢️ Physics Lab Oil';
    if (navigator.share) navigator.share({ title: title, text: text }).catch(() => {});
    else copyAction();
}

// ═══ 22. تقرير PDF ═══
function printReport() {
    if (!finalShown) { showToast('⚠️ ' + t('print_needs_verdict')); return; }
    const container = document.getElementById('reportContainer');
    const now = new Date();
    const oil = getCurrentOilData();
    let sensorRows = '';
    for (let i = 1; i <= 3; i++) {
        const st = sensorState[i];
        const icon = i === 1 ? '📳' : i === 2 ? '🧲' : '📸';
        let cls = 'none', statusText = t('not_measured'), valueText = '—';
        if (st.status === 'done' && st.confirmed) { cls = 'ok'; statusText = '✅ ' + t('confirmed_msg'); valueText = st.value || '—'; }
        else if (st.status === 'done') { cls = 'ok'; statusText = '⚡ ' + t('measure_done'); valueText = st.value || '—'; }
        else if (st.status === 'skipped') { cls = 'skip'; statusText = '⏭ ' + t('skipped_msg'); }
        sensorRows += '<div class="sensor-row ' + cls + '"><span>' + icon + ' ' + t('sensor' + i) + '</span><span>' + statusText + ' | ' + valueText + '</span></div>';
    }
    const verdictSentence = document.getElementById('verdictSentence').textContent || t('no_data');
    const verdictSolution = document.getElementById('verdictSolution').textContent || '';
    const sensorCount = document.getElementById('sensorCountNotice').textContent || '';
    let html = '';
    html += '<div class="report-header"><h1>🛢️ Physics Lab Oil</h1><div class="subtitle">' + t('app_title') + '</div></div>';
    html += '<div class="report-info">';
    html += '<div><strong>' + t('report_device') + '</strong>' + document.getElementById('deviceId').textContent + '</div>';
    html += '<div><strong>' + t('report_date') + '</strong>' + now.toLocaleDateString('en-GB') + '</div>';
    html += '<div><strong>' + t('report_time') + '</strong>' + now.toLocaleTimeString('en-GB') + '</div>';
    html += '<div><strong>' + t('oil_label') + '</strong>' + oil.label + '</div>';
    html += '</div>';
    html += '<div class="report-section"><h2>📊 ' + t('report_sensors_used') + '</h2>' + sensorRows + '</div>';
    html += '<div class="report-section"><h2>📋 ' + t('report_verdict') + '</h2>';
    html += '<div class="report-verdict"><p>' + verdictSentence + '</p>';
    if (verdictSolution && verdictSolution.length > 3) html += '<div class="solution">🔧 ' + verdictSolution + '</div>';
    html += '</div>';
    html += '<div style="text-align:center;font-size:0.75rem;color:#666;margin-top:8px">' + sensorCount + '</div></div>';
    const noteText = (document.getElementById('noteTextArea').value || '').trim();
    if (noteText.length >= 4) {
        html += '<div class="report-note">💭 ' + noteText + '</div>';
    }
    html += '<div class="report-disclaimer">⚠️ ' + t('legal') + '</div>';
    html += '<div class="report-watermark">Powered by Physics Lab Oil</div>';
    html += '<div class="report-actions">';
    html += '<button class="btn-print-pdf" onclick="window.print()">' + t('report_print_pdf') + '</button>';
    html += '<button class="btn-close-report" onclick="closeReport()">✖ ' + t('report_close_btn') + '</button>';
    html += '</div>';
    container.innerHTML = html;
    document.getElementById('reportOverlay').classList.add('show');
}
function closeReport() { document.getElementById('reportOverlay').classList.remove('show'); }

// ═══ 23. الموقع ═══
function initLocation() {
    const el = document.getElementById('locationDisplay');
    if (!el) return;
    if (!navigator.geolocation) { locationStatus = 'unavailable'; el.textContent = t('location_unavailable'); return; }
    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude.toFixed(4);
            const lon = pos.coords.longitude.toFixed(4);
            locationStatus = lat + ', ' + lon;
            el.textContent = locationStatus;
        },
        () => { locationStatus = 'denied'; el.textContent = t('location_denied'); },
        { timeout: 8000 }
    );
}

// ═══ 24. الشعار ═══
function attachLogoEvents() {
    const logoBtn = document.getElementById('logoBtn');
    if (!logoBtn) return;
    logoBtn.addEventListener('click', () => {
        logoClickCount++;
        clearTimeout(logoClickTimer);
        if (logoClickCount >= 5) { logoClickCount = 0; openAdminModal(); return; }
        logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 2000);
    });
}

// ═══ 25. التهيئة ═══
function init() {
    sanitizeLegacyHash();
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id) {
        id = 'OIL-' + Math.random().toString(36).slice(2, 10).toUpperCase();
        localStorage.setItem(DEVICE_KEY, id);
    }
    document.getElementById('deviceId').textContent = id;
    loadCredits();
    buildLangSelect();
    renderOilSelector();
    applyTranslations();
    updateDateTime();
    setInterval(updateDateTime, 1000);
    initLocation();
    attachLogoEvents();
    updateAllSensorUIs();
    document.getElementById('noteTextArea').addEventListener('input', function() { userNote = this.value; });
    if (getTotalCredits() <= 0) document.getElementById('purchasePrompt').classList.add('show');
    document.getElementById('secretModal').addEventListener('click', e => { if (e.target.id === 'secretModal') closeAdminModal(); });
    document.getElementById('reportOverlay').addEventListener('click', e => { if (e.target.id === 'reportOverlay') closeReport(); });
    document.getElementById('finalConfirmOverlay').addEventListener('click', e => { if (e.target.id === 'finalConfirmOverlay') cancelFinalVerdict(); });
    document.getElementById('legalModalOverlay').addEventListener('click', e => { if (e.target.id === 'legalModalOverlay') closeLegalModal(); });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeAdminModal(); closeReport(); closeLegalModal(); cancelFinalVerdict(); }
    });
    console.log('🛢️ Physics Lab Oil — V-Final');
    console.log('📊 3 sensors · 17 oils · 23 languages (all active)');
    console.log('🔇 Notes influence verdict silently (≤5%), no warning shown');
    console.log('👆 Click 🛢️ 5 times for developer mode');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
